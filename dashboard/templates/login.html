{% extends "base.html" %}

{% block title %}IDS Console - Login{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center">
    <div class="w-full max-w-md">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-8 shadow-2xl shadow-black/40 ring-1 ring-white/5">
            <div class="mb-7 text-center">
                <span class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-cyan-500/10 text-cyan-400 ring-1 ring-cyan-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-6 w-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                    </svg>
                </span>
                <h2 class="text-2xl font-semibold tracking-tight text-white">Secure Access</h2>
                <p class="mt-1 text-sm text-slate-400">Authenticate with your TOTP credentials</p>
            </div>

            <form method="POST" action="{{ url_for('main.login_submit') }}" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>
                    <label for="username" class="mb-1.5 block text-sm font-medium text-slate-300">Username</label>
                    <input id="username" type="text" name="username" required autocomplete="username"
                        class="block w-full rounded-lg border border-slate-700 bg-slate-950/60 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 transition-colors duration-200 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/30"
                        placeholder="analyst">
                </div>

                <div>
                    <label for="totp_code" class="mb-1.5 block text-sm font-medium text-slate-300">TOTP Code</label>
                    <input id="totp_code" type="text" name="totp_code" required inputmode="numeric"
                        pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"
                        class="block w-full rounded-lg border border-slate-700 bg-slate-950/60 px-3.5 py-2.5 text-center text-lg tracking-[0.5em] text-slate-100 placeholder-slate-600 transition-colors duration-200 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/30"
                        placeholder="000000">
                </div>

                <button type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-lg bg-cyan-500 px-4 py-2.5 text-sm font-semibold text-slate-950 shadow-lg shadow-cyan-500/20 transition-all duration-200 hover:bg-cyan-400 hover:shadow-cyan-400/30 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4 w-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
                    </svg>
                    Sign In
                </button>
            </form>
        </div>

        <p class="mt-6 text-center text-xs text-slate-500">
            Antigravity-IDS &middot; Authorized access only
        </p>
    </div>
</div>
{% endblock %}
