[build-system]
requires = ["setuptools>=75"]
# NOTE: spec listed "setuptools.backends.legacy:build", which is not a valid
# setuptools backend and would break `uv pip install -e .` in CI. Using the
# canonical PEP 517 entry point instead.
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-ids"
version = "0.2.0"
description = "Modular intrusion detection system with TOTP auth, network sensing, and FIM"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "scapy>=2.5",
    "cryptography>=50.0.2",
    "pyotp>=2.9",
    "qrcode>=8.0",
    "Flask>=3.0",
    "Flask-Talisman>=1.1",
    "Flask-WTF>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]
prod = [
    # Waitress is the supported production server: pure-Python and
    # Windows-compatible (gunicorn is POSIX-only and cannot run on Windows).
    "waitress>=3.0",
]

# Discover nested modules and include runtime resources in regular wheels.
[tool.setuptools.packages.find]
include = ["ai*", "alerts*", "auth*", "dashboard*", "demo*", "detection*", "fim*", "ids*", "logs*", "network*", "vision*"]
exclude = ["tests*", "build*", "dist*"]

[tool.setuptools.package-data]
auth = ["schema.sql"]
dashboard = ["templates/*.html", "static/*.js", "static/*.css"]
demo = ["sample_events.jsonl", "protected/*.txt"]
detection = ["schema.sql"]
fim = ["schema.sql", "config.example.json"]
logs = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "E501"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "tmpclean_test/*", "*/site-packages/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
