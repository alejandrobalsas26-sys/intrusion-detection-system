name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Run ruff
        # uvx descarga y ejecuta ruff al vuelo sin tocar el sistema
        run: uvx ruff check . --output-format=github

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Create virtual environment and install deps
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          uv run pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=50
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          include-hidden-files: true
